name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Analyze and verify icons
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: git diff --exit-code -- android/app/src/main/res macos/Runner/Assets.xcassets/AppIcon.appiconset windows/runner/resources/app_icon.ico
      - run: flutter analyze

  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android
            os: ubuntu-latest
            command: flutter build apk --debug
          - platform: Linux
            os: ubuntu-latest
            command: flutter build linux --debug
          - platform: macOS
            os: macos-latest
            command: flutter build macos --debug
          - platform: Windows
            os: windows-latest
            command: flutter build windows --debug
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - name: Install Linux desktop build dependencies
        if: matrix.platform == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter pub get
      - run: ${{ matrix.command }}
