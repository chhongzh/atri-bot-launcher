name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android
            os: ubuntu-latest
            command: flutter build apk --release
            package: mkdir -p dist && cp build/app/outputs/flutter-apk/app-release.apk dist/atri-bot-launcher-android.apk
          - platform: Linux
            os: ubuntu-latest
            command: flutter build linux --release
            package: mkdir -p dist && tar -C build/linux/x64/release/bundle -czf dist/atri-bot-launcher-linux-x64.tar.gz .
          - platform: macOS
            os: macos-latest
            command: flutter build macos --release
            package: mkdir -p dist && ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/Atri Bot Launcher.app" dist/atri-bot-launcher-macos.zip
          - platform: Windows
            os: windows-latest
            command: flutter build windows --release
            package: New-Item -ItemType Directory -Force dist | Out-Null; Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/atri-bot-launcher-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Install Linux desktop build dependencies
        if: matrix.platform == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter pub get
      - run: ${{ matrix.command }}
      - name: Package release asset
        run: ${{ matrix.package }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }} release
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
