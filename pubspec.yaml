name: atri_bot_launcher
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  dio: ^5.11.0
  flutter:
    sdk: flutter
  archive: ^4.0.7
  flutter_local_notifications: 18.0.1
  flutter_system_proxy: ^0.2.0
  get: ^4.7.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  yaml: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

flutter_native_splash:
  android: true
  image: "assets/ATRI.png"
  color: "#FFFFFF"
  android_12:
    image: "assets/ATRI.png"
    color: "#FFFFFF"

flutter_launcher_icons:
  android: true
  macos:
    generate: true
    image_path: "assets/ATRI.png"
  windows:
    generate: true
    image_path: "assets/ATRI.png"
  image_path: "assets/ATRI.png"
